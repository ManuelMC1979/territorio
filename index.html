<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Territorios Loncomilla</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .main-layout {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px 20px;
            width: 250px;
            height: fit-content;
        }

        .sidebar h3 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5em;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 10px;
        }

        .sidebar-menu button {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background: #3498db;
            color: white;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .sidebar-menu button:hover {
            background: #2980b9;
            transform: translateX(5px);
        }

        .sidebar-menu button:active {
            transform: translateX(3px);
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 60px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .content {
            margin-top: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            padding: 20px;
            background: #2c3e50;
            border-radius: 10px;
        }

        .territory-btn {
            padding: 25px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .territory-btn::before {
            content: attr(data-territorio);
            position: absolute;
            top: 5px;
            left: 8px;
            font-size: 0.7em;
            opacity: 0.8;
            font-weight: normal;
        }

        .territory-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .territory-btn:active {
            transform: translateY(-1px);
        }

        .percentage {
            display: block;
            font-size: 0.8em;
            margin-top: 5px;
            opacity: 0.9;
        }

        /* Colores según porcentaje */
        .green-high { background: #1abc9c; }
        .green-med { background: #3498db; }
        .green-light { background: #9b59b6; }
        .yellow-green { background: #f39c12; }
        .yellow { background: #e67e22; }
        .orange { background: #e74c3c; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            max-height: 90vh;
            width: auto;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
        }

        .modal-header h2 {
            color: #2c3e50;
            margin: 0;
        }

        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .close-btn:hover {
            background: #c0392b;
        }

        .territory-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .territory-table th {
            background: #3498db;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: 600;
        }

        .territory-table td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ecf0f1;
            position: relative;
        }

        .territory-table tr:hover {
            background: #f8f9fa;
        }

        .dias-cell, .fecha-cell {
            cursor: help;
        }

        .dias-cell:hover::after, .fecha-cell:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #2c3e50;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            white-space: nowrap;
            font-size: 0.9em;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .dias-cell:hover::before, .fecha-cell:hover::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            border: 5px solid transparent;
            border-top-color: #2c3e50;
            z-index: 1001;
        }

        .promedio-cell {
            font-size: 1.5em;
            font-weight: bold;
            background: #ecf0f1 !important;
        }

        /* Modal de Estadísticas */
        .stats-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
        }

        .stats-modal.active {
            display: flex;
        }

        .stats-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 95%;
            max-height: 90vh;
            width: 1000px;
            overflow-y: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-card h4 {
            margin: 0 0 10px 0;
            font-size: 0.9em;
            opacity: 0.9;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .stats-table th {
            background: #3498db;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        .stats-table td {
            padding: 10px 12px;
            border: 1px solid #ecf0f1;
        }

        .stats-table tr:nth-child(even) {
            background: #f8f9fa;
        }

        .stats-table tr:hover {
            background: #e8f4f8;
        }

        /* Gráficos */
        .chart-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .chart-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .chart-card h4 {
            color: #2c3e50;
            margin: 0 0 15px 0;
            text-align: center;
            font-size: 1em;
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 150px;
            background: #f8f9fa;
            border-radius: 5px;
            padding: 10px;
            position: relative;
        }

        .bar {
            flex: 1;
            margin: 0 2px;
            background: linear-gradient(to top, #3498db, #5dade2);
            border-radius: 5px 5px 0 0;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        .bar:hover {
            background: linear-gradient(to top, #2980b9, #3498db);
            transform: translateY(-5px);
        }

        .bar-value {
            position: absolute;
            top: -25px;
            font-size: 0.8em;
            font-weight: bold;
            color: #2c3e50;
        }

        .bar-label {
            font-size: 0.7em;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .chart-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ecf0f1;
        }

        .chart-stat {
            text-align: center;
        }

        .chart-stat-label {
            font-size: 0.7em;
            color: #7f8c8d;
            margin-bottom: 3px;
        }

        .chart-stat-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Reportes */
        .report-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .report-card {
            background: white;
            border: 2px solid #ecf0f1;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .report-card:hover {
            border-color: #3498db;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .report-card-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .report-card-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .report-card-desc {
            font-size: 0.9em;
            color: #7f8c8d;
        }

        .print-only {
            display: none;
        }

        @media print {
            .sidebar, .modal-header button, .no-print {
                display: none !important;
            }
            
            .print-only {
                display: block;
            }

            body {
                background: white;
            }

            .stats-content {
                max-width: 100%;
                box-shadow: none;
            }
        }
    </style>
</head>

        // Persistencia en localStorage
        const STORAGE_KEY = 'territoriosData';
        function loadTerritoriosData(){
            try{
                const raw = localStorage.getItem(STORAGE_KEY);
                if(!raw) return;
                const parsed = JSON.parse(raw);
                if(parsed && typeof parsed === 'object'){
                    territoriosData = parsed;
                }
            }catch(e){ console.warn('No se pudo cargar dataset desde localStorage:', e); }
        }
        function saveTerritoriosData(){
            try{
                localStorage.setItem(STORAGE_KEY, JSON.stringify(territoriosData));
            }catch(e){ console.warn('No se pudo guardar dataset en localStorage:', e); }
        }

        function openModal(territorioId = 1) {
            const data = territoriosData[territorioId];
            if (!data) {
                alert('No hay datos para el Territorio ' + territorioId);
                return;
            }

            // Actualizar título con T.X
            document.getElementById('modalTitle').textContent = `T.${territorioId} - ${data.nombre}`;

            // Actualizar tabla
            const tbody = document.querySelector('.territory-table tbody');
            tbody.innerHTML = '';

            data.letras.forEach((item, index) => {
                const tr = document.createElement('tr');
                const tooltipDias = item.totalDias > 0 
                    ? `${item.totalDias} días de atraso sin trabajar` 
                    : 'Sin atraso';
                const tooltipFecha = `Se ha trabajado ${item.xFecha} ${item.xFecha === 1 ? 'vez' : 'veces'} en el año`;
                
                if (index === 0) {
                    tr.innerHTML = `
                        <td rowspan="${data.letras.length}" style="font-size: 1.5em; font-weight: bold;">T.${territorioId}</td>
                        <td>${item.letra}</td>
                        <td class="dias-cell" data-tooltip="${tooltipDias}">${item.totalDias}</td>
                        <td class="fecha-cell" data-tooltip="${tooltipFecha}">${item.xFecha}</td>
                        <td rowspan="${data.letras.length}" class="promedio-cell">${data.promedio}</td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td>${item.letra}</td>
                        <td class="dias-cell" data-tooltip="${tooltipDias}">${item.totalDias}</td>
                        <td class="fecha-cell" data-tooltip="${tooltipFecha}">${item.xFecha}</td>
                    `;
                }
                
                tbody.appendChild(tr);
            });

            document.getElementById('territoryModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('territoryModal').classList.remove('active');
        }

        function parseLineTokens(line) {
            // Normaliza separadores ; \t múltiples espacios a coma
            let norm = line.trim().replace(/[;\t]+/g, ',').replace(/\s{2,}/g, ' ');
            // Si hay espacios sin comas, intenta separar por espacios
            if (!norm.includes(',')) {
                const partsSpace = norm.split(/\s+/);
                if (partsSpace.length >= 3) return partsSpace;
            }
            return norm.split(',').map(s => s.trim()).filter(s => s.length > 0);
        }

        function parseTextarea(text) {
            const lines = text.split(/\r?\n/);
            const items = [];
            const errors = [];
            lines.forEach((line, idx) => {
                const trimmed = line.trim();
                if (!trimmed) return;
                if (/^t\s*\.|^promedio/i.test(trimmed)) return; // ignora líneas de títulos
                const parts = parseLineTokens(trimmed);
                if (parts.length < 3) {
                    errors.push(`Línea ${idx + 1}: formato inválido (se esperan 3 columnas)`);
                    return;
                }
                const letra = String(parts[0]).toUpperCase();
                const totalDias = parseInt(parts[1], 10);
                const xFecha = parseInt(parts[2], 10);
                if (!letra || isNaN(totalDias) || isNaN(xFecha)) {
                    errors.push(`Línea ${idx + 1}: valores inválidos (letra/días/xFecha)`);
                    return;
                }
                items.push({ letra, totalDias, xFecha });
            });
            return { items, errors };
        }

        function previsualizarActualizacion() {
            const txt = document.getElementById('updTextarea').value || '';
            const { items, errors } = parseTextarea(txt);
            const errEl = document.getElementById('updError');
            const prevEl = document.getElementById('updPreview');
            errEl.textContent = errors.join('\n');
            if (items.length === 0) {
                prevEl.innerHTML = '<p style="color:#7f8c8d;">Sin filas válidas para mostrar.</p>';
                return;
            }
            const rows = items.map(i => `<tr><td><strong>${i.letra}</strong></td><td style=\"text-align:center\">${i.totalDias}</td><td style=\"text-align:center\">${i.xFecha}</td></tr>`).join('');
            prevEl.innerHTML = `
                <h4 style="color:#2c3e50;">Previsualización</h4>
                <table style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr style="background:#3498db; color:white;">
                            <th style="padding:6px; text-align:left;">Letra</th>
                            <th style="padding:6px; text-align:center;">Total días</th>
                            <th style="padding:6px; text-align:center;">X Fecha</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function aplicarActualizacion() {
            const terrId = parseInt(document.getElementById('updTerrId').value, 10);
            const nombre = (document.getElementById('updNombre').value || '').trim();
            const promedioVal = document.getElementById('updPromedio').value;
            const txt = document.getElementById('updTextarea').value || '';
            const { items, errors } = parseTextarea(txt);
            const errEl = document.getElementById('updError');
            errEl.textContent = '';

            if (isNaN(terrId) || terrId < 1 || terrId > 41) {
                errEl.textContent = 'Debe indicar un número de territorio válido (1–41).';
                return;
            }
            if (errors.length) {
                errEl.textContent = 'Corrige errores antes de actualizar:\n' + errors.join('\n');
                return;
            }
            if (items.length === 0) {
                errEl.textContent = 'No hay filas válidas para actualizar.';
                return;
            }

            const current = territoriosData[terrId] || { nombre: `Territorio ${terrId}`, letras: [], promedio: 0 };
            territoriosData[terrId] = {
                nombre: nombre || current.nombre,
                letras: items,
                promedio: promedioVal ? parseInt(promedioVal, 10) : current.promedio
            };

            // Actualizar colores/títulos de botones
            setButtonAlertColors();

            // Guardar persistente
            saveTerritoriosData();

            alert(`✅ Territorio T.${terrId} actualizado (${items.length} letras).`);
        }

        // Opcional: restaurar dataset al estado inicial del archivo
        function restaurarDatosPorDefecto(){
            if(!confirm('¿Seguro que deseas restaurar el dataset por defecto? Se perderán cambios guardados.')) return;
            try{
                localStorage.removeItem(STORAGE_KEY);
                // Recargar página para tomar el dataset embebido
                location.reload();
            }catch(e){
                alert('No se pudo restaurar: ' + e.message);
            }
        }

        // Cerrar modal de estadísticas al hacer clic fuera
        window.addEventListener('click', function(event) {
            const statsModal = document.getElementById('statsModal');
            if (event.target === statsModal) {
                closeStatsModal();
            }
        });

        // Colorea los botones según días de atraso: verde (0) / rojo (>0)
        function setButtonAlertColors() {
            for (let i = 1; i <= 41; i++) {
                const btn = document.querySelector(`[data-territorio="T.${i}"]`);
                const territorio = territoriosData[i];
                if (!btn || !territorio || !Array.isArray(territorio.letras)) continue;

                const totalDiasAtraso = territorio.letras.reduce((sum, l) => sum + (l.totalDias || 0), 0);
                const totalLetras = territorio.letras.length;
                const promedio = territorio.promedio;
                const letrasConAtraso = territorio.letras
                    .filter(l => (l.totalDias || 0) > 0)
                    .map(l => `${l.letra} (${l.totalDias})`)
                    .join(', ');

                btn.style.background = totalDiasAtraso > 0 ? '#e74c3c' : '#27ae60';
                btn.title = `${territorio.nombre}\nLetras: ${totalLetras} | Atraso: ${totalDiasAtraso} | Promedio: ${promedio}` + (letrasConAtraso ? `\nLetras con atraso: ${letrasConAtraso}` : '');
            }
        }

        // Fecha y hora en tiempo real
        function startDateTimeClock(){
            const el = document.getElementById('datetimeDisplay');
            if(!el) return;
            function fmt(){
                const now = new Date();
                const optsDate = { year: 'numeric', month: 'long', day: 'numeric' };
                const optsTime = { hour: '2-digit', minute: '2-digit' };
                const fecha = now.toLocaleDateString('es-ES', optsDate);
                const hora = now.toLocaleTimeString('es-ES', optsTime);
                el.textContent = `${hora} — ${fecha}`;
            }
            fmt();
            setInterval(fmt, 1000);
        }

        // Ejecutar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            loadTerritoriosData();
            setButtonAlertColors();
            startDateTimeClock();
        });
    </script>
</body>
</html>
